<style>
  [data-spmiddle-mse-root] {
    font-family: "Petrobras Sans", Arial, sans-serif;
    color: #242424;
    background: #fff;
    border: 1px solid #e3e9ed;
    padding: 24px;
    max-width: 960px;
    margin: 0 auto;
  }

  [data-spmiddle-mse-root] h2 {
    color: #008542;
    margin: 0 0 8px;
  }

  [data-spmiddle-mse-root] button {
    background: #008542;
    color: #fff;
    border: 0;
    padding: 8px 14px;
    margin: 4px;
    cursor: pointer;
  }

  [data-spmiddle-mse-root] input,
  [data-spmiddle-mse-root] select {
    padding: 8px;
    border: 1px solid #e3e9ed;
    margin: 4px;
  }

  [data-spmiddle-mse-root] .spmiddle-status {
    border-left: 4px solid #fdc82f;
    padding: 8px;
    margin: 12px 0;
  }

  [data-spmiddle-mse-root] .spmiddle-items {
    display: grid;
    gap: 8px;
    margin-top: 12px;
  }

  [data-spmiddle-mse-root] .spmiddle-item {
    border: 1px solid #e3e9ed;
    padding: 12px;
  }

  [data-spmiddle-mse-root] .spmiddle-metrics {
    font-size: 12px;
    color: #75787b;
    margin-top: 16px;
  }
</style>

<section
  data-spmiddle-mse-root
  data-spmiddle-instance="preview"
  aria-labelledby="spmiddle-title"
>
  <h2 id="spmiddle-title">SPMIDDLE — validação incremental</h2>

  <p>
    Host de validação com dados placeholder.
    Ações internas atualizam somente a região afetada.
  </p>

  <div>
    <label for="spmiddle-query">Consulta</label>
    <input
      id="spmiddle-query"
      type="search"
      placeholder="&lt;consulta&gt;"
    />
    <button type="button" data-spmiddle-action="query">
      Consultar
    </button>

    <label for="spmiddle-filter">Filtro</label>
    <select id="spmiddle-filter">
      <option value="all">Todos</option>
      <option value="Boletim">Boletim</option>
      <option value="Conhecimento">Conhecimento</option>
      <option value="Docs e padrões">Docs e padrões</option>
      <option value="Iniciativas">Iniciativas</option>
      <option value="Institucional">Institucional</option>
      <option value="Serviços e processos">Serviços e processos</option>
    </select>

    <button type="button" data-spmiddle-action="filter">Filtrar</button>
    <button type="button" data-spmiddle-action="update">
      Atualizar item
    </button>
    <button type="button" data-spmiddle-action="layout">
      Alternar layout
    </button>
    <button type="button" data-spmiddle-action="external">
      Fallback externo
    </button>
  </div>

  <div
    class="spmiddle-status"
    role="status"
    aria-live="polite"
    data-spmiddle-status
  >
    Pronto
  </div>

  <div class="spmiddle-items" data-spmiddle-items aria-busy="false"></div>
  <div class="spmiddle-metrics" data-spmiddle-metrics></div>
</section>
